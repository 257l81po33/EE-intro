 if(o.cap){mesh(Cy(.28,.3,.12,16),M(o.cap),0,.2,-.01,h);mesh(B(.32,.02,.22),M(o.cap),0,.15,.28,h)}
 if(o.glasses)[-.1,.1].forEach(x=>mesh(new THREE.TorusGeometry(.065,.013,6,14),M(0x222222),x,.04,.265,h));
 if(o.bag)mesh(B(.36,.42,.16),M(o.bag),0,.86,-.25,k);
 if(o.tie)mesh(B(.07,.32,.02),M(0xc0392b),0,.88,.26,k);
 g.scale.setScalar(o.s||.95);return{g,legs,arms,k}}
function actor(o,x,y,spd,id){const a=person(o);a.x=x;a.y=y;a.tx=x;a.ty=y;a.spd=spd;a.h=GY;a.ph=Math.random()*6;a.w=0;S.add(a.g);if(id){a.g.userData.id=id;picks.push(a.g)}return a}
const chair=actor({shirt:0x1c3f73,pants:0x1c3f73,hair:0xb9bcc2,glasses:1,tie:1,s:1.05},520,335,0,"intro");chair.g.rotation.y=-.5;
const me=actor({shirt:0xff6b8b,pants:0x3a4a6b,hair:0x2a1f1a,cap:0xf2b400,bag:0x3a4a6b,s:1},400,375,120);
const ml=label("我",24,"#ff6b8b","#fff");ml.position.set(0,2.3,0);me.g.add(ml);
const hairs=[0x3a2a22,0x1d1d1d,0x6b3f26,0x2a2a35],pants=[0x35507a,0x4a4a55,0x3d5a4a,0x5a4a3a];
const studs={};let talking=null;
const rnd=()=>{for(let n=0;n<12;n++){const a=Math.random()*6.283,r=Math.sqrt(Math.random()),x=450+r*280*Math.cos(a),y=300+r*150*Math.sin(a);
 if(P.every(p=>Math.hypot(p.x-x,p.y-y)>75)&&Math.hypot(x-450,y-300)>52)return[x,y]}return[450,380]};
Object.keys(Y).forEach((k,i)=>{const[x,y]=rnd();const a=actor({shirt:Y[k].c,pants:pants[i],hair:hairs[i],bag:[0x2f4f7a,0x8a5a3a,0x4a4a55,0x7a3a3a][i],cap:i===0?0x2f4f7a:0,s:.95},x,y,60,k);
 const l=label(Y[k].n,22,Y[k].c,"#fff");l.position.set(0,2.2,0);a.g.add(l);a.badge=l;studs[k]=a;
 const roam=()=>{let w=900;if(!reduce&&talking!==k){const[nx,ny]=rnd();a.tx=nx;a.ty=ny;w=Math.hypot(nx-a.x,ny-a.y)/a.spd*1000+400+Math.random()*1500}setTimeout(roam,w)};setTimeout(roam,400+i*600)});
const all=[chair,me,...Object.values(studs)];
function upd(a,dt){const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);let f=null;a.w=0;
 if(d>1){const st=Math.min(d,a.spd*dt);a.x+=dx/d*st;a.y+=dy/d*st;a.w=1;f=Math.atan2(dx,dy)}else if(a.look)f=Math.atan2(a.look.x-a.x,a.look.y-a.y);
 if(f!==null){let df=f-a.g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));a.g.rotation.y+=df*Math.min(1,dt*10)}
 const th=Math.hypot(wx(a.x),wz(a.y))<3.3?.74:GY;a.h+=(th-a.h)*Math.min(1,dt*10);
 if(a.w){a.ph+=dt*9;const s=Math.sin(a.ph);a.legs[0].rotation.x=s*.7;a.legs[1].rotation.x=-s*.7;a.arms[0].rotation.x=-s*.6;a.arms[1].rotation.x=s*.6;a.k.position.y=Math.abs(s)*.05}
 else{[...a.legs,...a.arms].forEach(l=>l.rotation.x*=Math.max(0,1-dt*12));a.k.position.y*=.8}
 a.g.position.set(wx(a.x),a.h,wz(a.y))}
function bubble(k,txt){Object.values(studs).forEach(a=>{if(a.bub){a.g.remove(a.bub);a.bub.material.map.dispose();a.bub=null}if(a.badge)a.badge.visible=true});
 if(!k)return;const a=studs[k],l=label(txt,22);l.position.set(0,2.75,0);a.g.add(l);a.bub=l;a.badge.visible=false}
// interaction
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let hov=null,down=null;
function pick(e){const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mv,C);
 const h=ray.intersectObjects(picks,true);for(const x of h){let o=x.object;while(o&&!o.userData.id)o=o.parent;if(o)return o}return null}
cv.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY,az,pol,m:false};cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>6)down.m=true;if(down.m){az=down.az-dx*.008;if(e.pointerType==="mouse")pol=Math.min(1.25,Math.max(.55,down.pol-dy*.005));cam()}}
 else{const o=pick(e);hov=o;cv.classList.toggle("hot",!!o)}});
cv.addEventListener("pointerup",e=>{if(down&&!down.m){const o=pick(e);if(o)show(o.userData.id)}down=null});
cv.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.min(1.5,Math.max(.6,zoom*(1+e.deltaY*.001)));cam()},{passive:false});
S.traverse(o=>{if(o.isMesh&&o!==water){o.castShadow=true;o.receiveShadow=true}});
// loop
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000),t=now/1000;last=now;
 all.forEach(a=>upd(a,dt));ticks.forEach(f=>f(t));
 if(!reduce)rings.forEach((r,i)=>{const p=(t*.22+i*.5)%1;r.scale.set(10.8*(1+p*.09),7.3*(1+p*.09),1);r.material.opacity=.6*(1-p)});
 [...picks].forEach(g=>{if(g.userData.id==="intro"||studs[g.userData.id])return;const s=g.scale.x,ts=hov===g?1.07:1;g.scale.setScalar(s+(ts-s)*Math.min(1,dt*10))});
 R.render(S,C)}
requestAnimationFrame(loop);
// dialog
const out=$("#out");
const setWho=(color,name)=>{const a=$("#av");a.textContent=color?"🧑‍🎓":"🧑‍🏫";a.style.background=color||"#1c3f73";$("#whoName").textContent=name};
const walk=(a,x,y)=>{a.tx=Math.min(750,Math.max(150,x));a.ty=Math.min(480,Math.max(100,y))};
const go=id=>document.querySelectorAll(".nav button[data-go]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.go===id));
function release(){talking=null;bubble(null);all.forEach(a=>a.look=null)}
window.talk=function(k,sem){const y=Y[k],a=studs[k];sem=sem||1;
 if(talking!==k){release();talking=k;a.tx=a.x;a.ty=a.y;a.look=me;me.look=a;walk(me,a.x<450?a.x+46:a.x-46,a.y+16)}
 go(k);setWho(y.c,y.n+"同學");const list=sem===1?y.s1:y.s2;bubble(k,"我在修"+list[0]+"…");
 out.innerHTML=`<h2>${y.n}同學</h2><p>「嗨!我是${y.n}的學生。${sem===1?"這學期(上學期)我正在修這些課:":"下學期我會修這些課:"}」</p>${chips(list,"must")}<p>「${Q[k]}」</p><p>${y.t}</p><div class="nav"><button onclick="talk('${k}',${sem===1?2:1})">${sem===1?"下學期會修什麼?":"回到上學期"}</button></div>`};
const talk=window.talk;
function show(id){
 if(Y[id])return talk(id);
 release();go(id);
 if(id==="core"){walk(me,450,365);setWho(null,"系主任");
  const G=[["數理基礎",["微積分","線性代數","工程數學","複變函數","機率學","普通物理","普通物理實驗","近代物理"],"所有工程學習的語言,大一大二最集中。"],["程式與數位",["計算機概論","程式語言","計算機實習","資料結構","交換電路與邏輯設計"],"從寫程式到理解數位電路。"],["電機核心",["電路學","電子學","電磁學","電磁波","訊號與系統","電工實驗"],"電機系的骨幹,電路學、電子學要依序修習。"],["共同課程",["國文","外文","博雅","歷史","憲政","體育","勞動服務"],"全校通識與基本素養。"]];
  out.innerHTML=`<h2>🏛️ 核心廣場</h2><p>系主任:「這裡是所有人的起點。先在廣場把核心課程學好,再往外選擇專業領域。」</p>${G.map(g=>`<div class="sem"><b>${g[0]}</b> <span style="font-size:13px;color:var(--muted)">${g[2]}</span>${chips(g[1],g[0]==="電機核心"?"must":"")}</div>`).join("")}<p>核心課程之後,還要從六個領域中選修:關聯圖有「六選三」與「六選四」兩種版本,請依入學年度確認。</p>`;return}

 const p=P.find(x=>x.id===id);
 if(p){walk(me,p.x,p.y+80);setWho(null,"系主任");
  out.innerHTML=`<h2>${p.icon} ${p.name}</h2><p>系主任:「${p.t}」</p><b>關鍵必修</b>${chips(p.must,"must")}<div class="sem"><b>相關基礎課</b>${chips(p.more)}</div><p>想了解更多,可以再逛逛其他地點,或點一位同學,我會走過去跟他聊聊。</p>`;return}

 setWho(null,"系主任");walk(me,450,365);
 if(id==="minor"){
  out.innerHTML=`<h2>輔系修讀</h2><p>系主任:「電機系輔系至少修 25 學分,以下皆為必修:」</p>${chips(["程式設計 3","電磁波 3","電磁學 3","電路學 3(一下、二上)","電子學 3(二上、二下、三上)"],"must")}<p>非工學士學生須加修工程數學 (I)(II) 共 6 學分。電路學與電子學要依序修習。</p>`;return}

 out.innerHTML=`<h2>歡迎來到電機島</h2><p>系主任:「我是系主任。這座島上有六個專業領域,同學們正在島上四處走動。點一位同學,你的角色會走過去和他聊他正在修的課;點建築,我來介紹領域。拖曳畫面可以轉動島嶼。」</p>`}
document.querySelectorAll(".nav button[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
show("intro");
}

</script>
